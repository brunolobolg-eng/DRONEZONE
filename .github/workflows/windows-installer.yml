name: Instalador Windows

# Gera o instalador .exe num runner Windows real.
# Execução: aba "Actions" do repositório > "Instalador Windows" > "Run workflow".
# O instalador e o instalar.bat ficam disponíveis como artefato da execução (download na própria página).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos e testes
        run: npm run check

      - name: Compilar a versão web e o processo principal do Electron
        run: |
          npm run build:web
          npm run build:electron

      - name: Gerar o instalador NSIS
        shell: pwsh
        run: |
          # Chama o CLI do electron-builder diretamente. Chamadas via npx/npm run terminaram sem gerar nada
          # nas primeiras execuções. A falha precisa parar o job, por isso o código de saída é propagado.
          node node_modules/electron-builder/cli.js --win nsis --x64 --publish never --config electron-builder.js
          if ($LASTEXITCODE -ne 0) { throw "electron-builder falhou com código $LASTEXITCODE" }
        env:
          # Sem certificado de assinatura: o instalador funciona, mas o Windows mostra aviso de editor desconhecido.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Listar os arquivos gerados
        if: always()
        run: |
          Get-ChildItem -Path release, dist -Recurse -Include *.exe, *.7z -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N1} MB" -f $_.FullName, ($_.Length / 1MB) }

      - name: Incluir o instalar.bat junto do instalador
        shell: pwsh
        run: |
          # O .bat fica versionado em installer/windows/, porque release/ não é commitada. Ele vai para o artefato ao lado do .exe.
          Copy-Item -Path installer/windows/instalar.bat -Destination release/instalar.bat -Force -ErrorAction Stop

      - name: Publicar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-fpv-instalador-windows
          path: |
            release/*.exe
            release/instalar.bat
          if-no-files-found: error
          retention-days: 14
